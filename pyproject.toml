[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "actionflow"
version = "0.1.0"
description = "端侧流式人体原子动作识别引擎 — 视频 → 带精确时间戳的结构化动作序列"
readme = "README.md"
requires-python = ">=3.9"
# SPDX 表达式（比老的 license={text=...} 更规范，2027-02 前需要迁移）
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "ActionFlow Contributors" }]
keywords = [
    "pose-estimation",
    "action-recognition",
    "temporal-action-localization",
    "streaming",
    "skeleton",
    "onnx",
    "edge-ai",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Multimedia :: Video",
    "Topic :: Scientific/Engineering :: Image Recognition",
]

dependencies = [
    "numpy>=1.21",
    "opencv-python>=4.5",
    "onnxruntime>=1.12",
]

[project.optional-dependencies]
train = [
    "torch>=1.13",
    "pyyaml>=6.0",
]
gui = [
    "pillow>=9.0",   # 标注 GUI 把 OpenCV 帧转成 tkinter 可显示的图像
]
dev = [
    "pytest>=7.0",
    "ruff>=0.1",
    "mypy>=1.0",
]
all = [
    "torch>=1.13",
    "pyyaml>=6.0",
    "pillow>=9.0",
    "pytest>=7.0",
    "ruff>=0.1",
]

[project.scripts]
actionflow = "actionflow.cli:main"
actionflow-evaluate = "actionflow.evaluate:main"

[project.urls]
Homepage = "https://gitee.com/lang_junnan_admin/actionflow"
Documentation = "https://gitee.com/lang_junnan_admin/actionflow/blob/main/docs/learning-guide.html"
Issues = "https://gitee.com/lang_junnan_admin/actionflow/issues"
Changelog = "https://gitee.com/lang_junnan_admin/actionflow/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["actionflow*"]

[tool.setuptools.package-data]
actionflow = ["configs/*.yaml"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B"]
ignore = [
    "E501",
    "B008",
    # T / B / J / C 是张量维度惯用名，与 PyTorch 论文写法一致，不强制小写。
    "N803",
    "N806",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
