name: 功能建议
description: 提出一个新功能或改进
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 描述你遇到的实际场景，而不是直接描述你想要的实现
      placeholder: |
        当我在______的时候，我需要______，但现在______。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议的方案
      description: 你设想的做法，以及为什么
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: 你考虑过的其他方案
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: 涉及哪一层
      options:
        - Layer 1 · 姿态估计
        - Layer 2 · 动作分类
        - Layer 3 · 时序解码
        - 数据 / 标注工具
        - 训练
        - 部署 / ONNX
        - 文档
        - 其他
    validations:
      required: false
